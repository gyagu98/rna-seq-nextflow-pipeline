name: Differential expression integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install distribution-tested analysis dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base r-bioc-deseq2 r-bioc-tximport
      - name: Run real analysis and reject invalid inputs
        run: Rscript tests/test_deseq2.R
