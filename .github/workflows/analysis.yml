name: Differential expression integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            bioc::DESeq2
            bioc::tximport
      - name: Run real analysis and reject invalid inputs
        run: Rscript tests/test_deseq2.R
